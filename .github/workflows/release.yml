name: Release

# v로 시작하는 태그를 푸시하면(예: v1.0.0) 릴리즈를 만들고
# Windows / macOS 실행 앱을 빌드해 압축 파일을 첨부합니다.
# (workflow_dispatch 로 수동 실행하면 빌드만 하고 릴리즈는 건너뜁니다 — 빌드 점검용)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows: 단일 .exe ────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 태그(vX.Y.Z)에서 버전을 뽑아 sealock/version.py 를 덮어씁니다. 리포에 커밋된
      # 값은 "+dev" placeholder 이고, 그 상태에서는 앱 내 업데이트가 비활성화됩니다.
      # (workflow_dispatch 로 돌린 빌드 점검에는 태그가 없으므로 건너뜁니다)
      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          path = pathlib.Path("sealock") / "version.py"
          path.write_text(f'"""App version — injected from the git tag by CI."""\n\n'
                          f'__version__ = "{version}"\n', encoding="utf-8")
          print(f"Injected __version__ = {version} (from tag {tag})")

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Sealock.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Sealock
          --icon icons/icon_win.ico
          --add-data "sealock/assets;sealock/assets"
          app.py

      - name: Zip
        run: Compress-Archive -Path dist/Sealock.exe -DestinationPath Sealock-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Sealock-Windows
          path: Sealock-Windows.zip

  # ── macOS (Apple Silicon): .app 번들 ─────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 태그(vX.Y.Z)에서 버전을 뽑아 sealock/version.py 를 덮어씁니다. 리포에 커밋된
      # 값은 "+dev" placeholder 이고, 그 상태에서는 앱 내 업데이트가 비활성화됩니다.
      # (workflow_dispatch 로 돌린 빌드 점검에는 태그가 없으므로 건너뜁니다)
      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          path = pathlib.Path("sealock") / "version.py"
          path.write_text(f'"""App version — injected from the git tag by CI."""\n\n'
                          f'__version__ = "{version}"\n', encoding="utf-8")
          print(f"Injected __version__ = {version} (from tag {tag})")

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Sealock.app
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name Sealock
          --icon icons/icon_mac.icns
          --osx-bundle-identifier com.sealock.app
          --add-data "sealock/assets:sealock/assets"
          app.py

      # ditto 로 압축해 .app 번들의 심볼릭 링크/권한을 보존합니다.
      - name: Zip .app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Sealock.app Sealock-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Sealock-macOS
          path: Sealock-macOS.zip

  # ── 릴리즈: 태그 푸시일 때만, 두 압축 파일을 첨부 ─────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4      # CHANGELOG.md 를 읽기 위해

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 릴리즈 본문 = CHANGELOG.md 의 해당 버전 섹션 + 마커 + 설치 안내.
      #
      # 청중이 둘이라 한 본문을 마커로 가릅니다. 마커 앞은 이미 앱을 쓰는 사람을 위한
      # 변경 사항이고, 앱은 이 부분만 잘라 "변경 사항" 으로 보여줍니다
      # (updater.NOTES_MARKER — 문자열이 양쪽에서 정확히 같아야 합니다). 마커 뒤의
      # 다운로드 표와 Gatekeeper 안내는 릴리즈 페이지에 처음 온 방문자용입니다.
      #
      # 섹션이 없으면 릴리즈를 실패시킵니다 — 노트 없는 버전은 내보내지 않습니다.
      - name: Build release body from CHANGELOG
        shell: python
        run: |
          import os, pathlib, re, sys

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          repo = os.environ["GITHUB_REPOSITORY"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          heads = list(re.finditer(r"^##\s*\[([^\]]+)\]", text, re.M))
          index = next((i for i, h in enumerate(heads) if h.group(1) == version), None)
          if index is None:
              sys.exit(f"CHANGELOG.md 에 [{version}] 섹션이 없습니다 — 릴리즈 노트를 먼저 쓰세요.")

          start = text.index("\n", heads[index].end())
          end = heads[index + 1].start() if index + 1 < len(heads) else len(text)
          notes = text[start:end].strip()
          if not notes:
              sys.exit(f"CHANGELOG.md 의 [{version}] 섹션이 비어 있습니다.")

          # 바로 아래 섹션이 이전 버전입니다 (첫 릴리즈면 없음).
          previous = heads[index + 1].group(1) if index + 1 < len(heads) else None
          compare = (f"https://github.com/{repo}/compare/v{previous}...{tag}" if previous
                     else f"https://github.com/{repo}/commits/{tag}")

          # 들여쓰기가 문자열에 섞이지 않도록 여러 줄 리터럴 대신 줄 목록으로 만듭니다.
          tail = [
              "",
              "<!-- github-only -->",
              "",
              "## 다운로드",
              "",
              "| 플랫폼 | 파일 | 실행 |",
              "|--------|------|------|",
              "| 🪟 Windows | `Sealock-Windows.zip` | 압축 해제 후 `Sealock.exe` 실행 |",
              "| 🍎 macOS (Apple Silicon) | `Sealock-macOS.zip` | 압축 해제 후 `Sealock.app` 실행 |",
              "",
              "> **macOS 첫 실행 안내** — 코드 서명이 안 된 앱이라 Gatekeeper가 막을 수 있습니다.",
              "> `Sealock.app`을 **우클릭 → 열기**(처음 한 번만)로 여세요. 그래도 막히면 터미널에서",
              "> `xattr -dr com.apple.quarantine Sealock.app` 실행 후 다시 여세요.",
              "",
              f"**전체 변경 내역**: {compare}",
          ]
          body = "\n".join([notes] + tail) + "\n"
          pathlib.Path("RELEASE_BODY.md").write_text(body, encoding="utf-8")

          # 본문은 UTF-8 파일로만 내보냅니다 — stdout 으로 찍으면 러너의 콘솔
          # 인코딩에 의존하게 되고, 표에 든 이모지가 그걸 깨뜨릴 수 있습니다.
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(f"### {tag} 릴리즈 노트\n\n{notes}\n")
          print(f"OK: {len(notes.splitlines())} lines from CHANGELOG [{version}]")
          print(f"compare: {compare}")

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Sealock-Windows/Sealock-Windows.zip
            artifacts/Sealock-macOS/Sealock-macOS.zip
          fail_on_unmatched_files: true
          body_path: RELEASE_BODY.md
